[project]
name = "opinare"
version = "0.1.0"
description = "MVP acadêmico de análise de sentimentos em português brasileiro"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "torch>=2.6,<3",
  "transformers>=4.50,<5",
  "emoji>=2.10,<3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
